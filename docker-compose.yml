services:
  rosek-api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      CORS_ORIGIN: "http://localhost:5500,https://roeserkk.github.io"
      MAX_UPLOAD_MB: 500
      RETENTION_MINUTES: 10
      MAX_CONCURRENT_JOBS: 1
    volumes:
      - rosek-temp:/tmp/rosek
volumes:
  rosek-temp:
